<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Face Door System</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --text: #1c2430;
      --muted: #687386;
      --line: #d9e0e7;
      --accent: #0f766e;
      --accent-2: #b45309;
      --danger: #b91c1c;
      --ok: #166534;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      letter-spacing: 0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 28px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
    }

    main {
      width: min(1280px, 100%);
      margin: 0 auto;
      padding: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 17px;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .metric {
      min-height: 84px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfd;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .metric strong {
      display: block;
      overflow-wrap: anywhere;
      font-size: 20px;
      line-height: 1.25;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      min-height: 40px;
      border: 0;
      border-radius: 8px;
      padding: 0 14px;
      color: #ffffff;
      background: var(--accent);
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #334155;
    }

    button.warning {
      background: var(--accent-2);
    }

    button.danger {
      background: var(--danger);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .logs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 18px;
    }

    .log-list {
      display: grid;
      gap: 8px;
      max-height: 360px;
      overflow: auto;
    }

    .log-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fbfcfd;
      font-size: 13px;
      line-height: 1.45;
    }

    .log-item b {
      display: inline-block;
      margin-right: 8px;
    }

    .ok {
      color: var(--ok);
    }

    .bad {
      color: var(--danger);
    }

    .muted {
      color: var(--muted);
    }

    @media (max-width: 860px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      main {
        padding: 16px;
      }

      .grid,
      .logs {
        grid-template-columns: 1fr;
      }

      .status-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 520px) {
      .status-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Face Door System</h1>
    <div class="muted" id="service-time">--</div>
  </header>

  <main>
    <section class="grid">
      <div class="panel">
        <h2>Status</h2>
        <div class="status-grid">
          <div class="metric"><span>State</span><strong id="state">--</strong></div>
          <div class="metric"><span>Person</span><strong id="person">--</strong></div>
          <div class="metric"><span>Score Count</span><strong id="score">--</strong></div>
          <div class="metric"><span>Similarity</span><strong id="similarity">--</strong></div>
          <div class="metric"><span>Cooldown</span><strong id="cooldown">--</strong></div>
          <div class="metric"><span>Recognition</span><strong id="camera">--</strong></div>
          <div class="metric"><span>Serial</span><strong id="serial">--</strong></div>
          <div class="metric"><span>Health</span><strong id="health">--</strong></div>
          <div class="metric"><span>Owner</span><strong id="owner">--</strong></div>
        </div>
      </div>

      <div class="panel">
        <h2>Controls</h2>
        <div class="actions">
          <button id="start-btn" type="button">Start Recognition</button>
          <button id="stop-btn" class="secondary" type="button">Stop Recognition</button>
          <button id="open-btn" class="warning" type="button">Open Door</button>
        </div>
        <p class="muted" id="action-result">Ready</p>
      </div>
    </section>

    <section class="logs">
      <div class="panel">
        <h2>Access Log</h2>
        <div class="log-list" id="access-log"></div>
      </div>
      <div class="panel">
        <h2>System Log</h2>
        <div class="log-list" id="system-log"></div>
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    async function api(path, options) {
      const response = await fetch(path, options);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.detail || data.message || response.statusText);
      }
      return data;
    }

    function value(text) {
      return text === null || text === undefined || text === "" ? "--" : text;
    }

    function renderStatus(status, health) {
      $("title").textContent = status.window_name || "Face Door System";
      $("service-time").textContent = status.service_time || "--";
      $("state").textContent = status.state;
      $("person").textContent = value(status.current_person);
      $("score").textContent = status.score_count;
      $("similarity").textContent = Number(status.last_similarity).toFixed(3);
      $("cooldown").textContent = status.in_cooldown
        ? `${status.cooldown_remaining}s`
        : "Ready";
      $("camera").textContent = status.camera_running ? "Running" : "Stopped";
      $("camera").className = status.camera_running ? "ok" : "bad";
      $("serial").textContent = status.serial_connected ? "Connected" : "Disconnected";
      $("serial").className = status.serial_connected ? "ok" : "bad";
      $("health").textContent = health.status;
      $("owner").textContent = status.owner_name || "--";
    }

    function renderAccess(items) {
      $("access-log").innerHTML = items.map((item) => `
        <div class="log-item">
          <b>${item.event_type || "event"}</b>
          <span class="muted">${item.timestamp || item.time || ""}</span><br>
          ${value(item.person_name)} | ${value(item.result)} | ${value(item.similarity)}
        </div>
      `).join("");
    }

    function renderSystem(items) {
      $("system-log").innerHTML = items.map((item) => `
        <div class="log-item">
          <b>${item.level || "LOG"}</b>
          <span class="muted">${item.timestamp || ""}</span><br>
          ${item.message || item.raw || ""}
        </div>
      `).join("");
    }

    async function refresh() {
      try {
        const [status, health, access, system] = await Promise.all([
          api("/api/status"),
          api("/api/health"),
          api("/api/logs/access?limit=12"),
          api("/api/logs/system?limit=12"),
        ]);
        renderStatus(status, health);
        renderAccess(access.items);
        renderSystem(system.items);
      } catch (error) {
        $("action-result").textContent = error.message;
      }
    }

    async function runAction(path) {
      const buttons = document.querySelectorAll("button");
      buttons.forEach((button) => button.disabled = true);
      try {
        const result = await api(path, { method: "POST" });
        $("action-result").textContent = result.message || "Done";
      } catch (error) {
        $("action-result").textContent = error.message;
      } finally {
        buttons.forEach((button) => button.disabled = false);
        refresh();
      }
    }

    $("start-btn").addEventListener("click", () => runAction("/api/recognition/start"));
    $("stop-btn").addEventListener("click", () => runAction("/api/recognition/stop"));
    $("open-btn").addEventListener("click", () => runAction("/api/door/open"));

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
